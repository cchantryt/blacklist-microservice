version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-2
    AWS_ACCOUNT_ID: "104073949253"
    IMAGE_REPO_NAME: blacklist-microservice

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python --version
      - python -m pip install -r requirements-dev.txt

  pre_build:
    commands:
      - echo "Iniciando pruebas unitarias"
      - mkdir -p reports
      - echo "Autenticando Docker en Amazon ECR"
      - AWS_ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ECR_URI"
      - REPOSITORY_URI="$AWS_ECR_URI/$IMAGE_REPO_NAME"
      - IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)

  build:
    commands:
      - echo "Ejecutando pruebas unitarias"
      - python -m pytest tests -v --junitxml=reports/junit.xml --cov=app --cov-report=term --cov-report=xml:reports/coverage.xml
      - echo "Construyendo imagen Docker"
      - docker build -t "$REPOSITORY_URI:$IMAGE_TAG" .
      - docker tag "$REPOSITORY_URI:$IMAGE_TAG" "$REPOSITORY_URI:latest"

  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          echo "Publicando imagen en Amazon ECR"
          docker push "$REPOSITORY_URI:$IMAGE_TAG"
          docker push "$REPOSITORY_URI:latest"
        else
          echo "La compilacion fallo. No se publica la imagen."
          exit 1
        fi

reports:
  blacklist-unit-tests:
    files:
      - junit.xml
    base-directory: reports
    file-format: JUNITXML

  blacklist-coverage:
    files:
      - coverage.xml
    base-directory: reports
    file-format: COBERTURAXML


